"$schema" = 'https://starship.rs/config-schema.json'

add_newline = true
palette = "tokyonight"

# Two-line frame: ╭─ … on top, ╰─☸ keel on the bottom (the keel lives in [character]).
# Cloudflare badges + HAL status quote ride the top line; battery only appears ≤20%.
format = """
[╭─](frame)$os$directory$git_branch$git_state$git_status${custom.cloudflare}${custom.cloudflare_prod}$cmd_duration$status
$character"""

# Right side: runtime versions + clock, so the left stays clean.
right_format = """$battery$nodejs$bun$python$rust$golang$php$docker_context$time"""

[palettes.tokyonight]
frame   = "#7dcfff"
fg      = "#c0caf5"
blue    = "#7aa2f7"
cyan    = "#7dcfff"
green   = "#9ece6a"
magenta = "#bb9af7"
red     = "#f7768e"
yellow  = "#e0af68"
orange  = "#ff9e64"
gray    = "#565f89"

[os]
disabled = false
style = "fg"
[os.symbols]
Macos = " "

[directory]
style = "bold blue"
truncation_length = 0
truncate_to_repo = false
read_only = "  "
read_only_style = "red"
home_symbol = "🏠"
format = "[ $path ]($style)[$read_only]($read_only_style)"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "

[git_branch]
symbol = " "
style = "bold magenta"
format = "[$symbol$branch]($style) "

[git_status]
style = "red"
format = '([\[$all_status$ahead_behind\]]($style) )'
conflicted = "="
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
up_to_date = "[ ](green)"
untracked = "?${count}"
stashed = "*${count}"
modified = "!${count}"
staged = "+${count}"
renamed = "»${count}"
deleted = "✘${count}"

[git_state]
style = "bold yellow"
format = '\([$state( $progress_current/$progress_total)]($style)\) '

[cmd_duration]
min_time = 500
style = "bold yellow"
format = "[  $duration]($style) "

[nodejs]
symbol = " "
style = "green"
format = "[$symbol($version )]($style)"

[bun]
symbol = " "
style = "fg"
format = "[$symbol($version )]($style)"

[python]
symbol = " "
style = "yellow"
format = "[$symbol($version )]($style)"

[rust]
symbol = " "
style = "orange"
format = "[$symbol($version )]($style)"

[golang]
symbol = " "
style = "cyan"
format = "[$symbol($version )]($style)"

[php]
symbol = " "
style = "magenta"
format = "[$symbol($version )]($style)"

[docker_context]
symbol = " "
style = "blue"
format = "[$symbol$context]($style) "
only_with_files = true

[time]
disabled = false
time_format = "%H:%M"
style = "gray"
format = "[  $time]($style)"

[character]
success_symbol = "[╰─☸ ](bold cyan)"
error_symbol = "[╰─◉ ](bold red)"   # the keel becomes Ghostwheel's eye on failure

# Ghostwheel announces the exit code of a failed command on the top line.
[status]
disabled = false
style = "bold red"
format = "[◉ $status — that Shadow won't yield, Dad]($style) "

# Battery: invisible until ≤20%, then red on the right side.
[battery]
full_symbol = "󰁹 "
charging_symbol = "󰂄 "
discharging_symbol = "󰂃 "
format = "[$symbol$percentage]($style) "

[[battery.display]]
threshold = 20
style = "bold red"

# Cloudflare tripwire: a wrangler config in the repo root means deploys are real.
# Cyan badge on a safe branch; red PROD warning on main/master — house rule:
# never `wrangler deploy` without explicit per-deploy approval.
[custom.cloudflare]
description = "wrangler repo on a non-main branch"
shell = ["sh"]
when = '''
r=$(git rev-parse --show-toplevel 2>/dev/null) || r="$PWD"
[ -f "$r/wrangler.toml" ] || [ -f "$r/wrangler.jsonc" ] || [ -f "$r/wrangler.json" ] || exit 1
b=$(git branch --show-current 2>/dev/null)
[ "$b" != "main" ] && [ "$b" != "master" ]
'''
command = "echo wrangler"
symbol = " "
style = "cyan"
format = "[$symbol$output]($style) "

[custom.cloudflare_prod]
description = "wrangler repo on main/master — deploys hit prod"
shell = ["sh"]
when = '''
r=$(git rev-parse --show-toplevel 2>/dev/null) || r="$PWD"
[ -f "$r/wrangler.toml" ] || [ -f "$r/wrangler.jsonc" ] || [ -f "$r/wrangler.json" ] || exit 1
b=$(git branch --show-current 2>/dev/null)
[ "$b" = "main" ] || [ "$b" = "master" ]
'''
command = "echo prod!"
symbol = " "
style = "bold red"
format = "[$symbol⚠ $output]($style) "
